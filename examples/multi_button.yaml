# Three modules on one I2C bus (up to eight are possible), all polled.
# Give every module its own DIP switch address and power-cycle it afterwards.

substitutions:
  sda_pin: GPIO21
  scl_pin: GPIO22

esphome:
  name: rgb-button-multi
  friendly_name: RGB Button Panel

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://ShadyMCShadesen/esphome-dfrobot-rgb-button@main
    components: [dfrobot_rgb_button]

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  frequency: 100kHz

dfrobot_rgb_button:
  # Scene button 1: toggles its own LED locally, even without Wi-Fi.
  - id: button_1
    address: 0x23 # A2..A0 = 0 0 0
    press_feedback: white
    on_double_click:
      # Notify on all three modules at once.
      - dfrobot_rgb_button.flash:
          id: button_1
          color: green
      - dfrobot_rgb_button.flash:
          id: button_2
          color: green
      - dfrobot_rgb_button.flash:
          id: button_3
          color: green

  # Scene button 2: only reports events to Home Assistant.
  - id: button_2
    address: 0x24 # A2..A0 = 0 0 1
    press_feedback: "#FF8000"

  # Button 3 mirrors the LED of button 1 (group sync) but keeps its own button events.
  - id: button_3
    address: 0x25 # A2..A0 = 0 1 0
    sync_with: button_1
    on_click:
      - dfrobot_rgb_button.set_status:
          id: button_1
          status: ok
          duration: 3s

light:
  - platform: dfrobot_rgb_button
    dfrobot_rgb_button_id: button_1
    name: "Button 1 LED"
    toggle_mode: click
    effects:
      - dfrobot_breathe:
      - dfrobot_color_cycle:

  - platform: dfrobot_rgb_button
    dfrobot_rgb_button_id: button_2
    name: "Button 2 LED"

binary_sensor:
  - platform: dfrobot_rgb_button
    dfrobot_rgb_button_id: button_1
    button:
      name: "Button 1"
    connected:
      name: "Button 1 Connected"

  - platform: dfrobot_rgb_button
    dfrobot_rgb_button_id: button_2
    button:
      name: "Button 2"
      # ESPHome's own multi-click detection works in polling mode as well.
      on_multi_click:
        - timing:
            - ON for at most 400ms
            - OFF for at most 300ms
            - ON for at most 400ms
            - OFF for at most 300ms
            - ON for at most 400ms
            - OFF for at least 200ms
          then:
            - logger.log: "Button 2: triple click"
    connected:
      name: "Button 2 Connected"

  - platform: dfrobot_rgb_button
    dfrobot_rgb_button_id: button_3
    button:
      name: "Button 3"
    connected:
      name: "Button 3 Connected"

event:
  - platform: dfrobot_rgb_button
    dfrobot_rgb_button_id: button_2
    click:
      name: "Button 2 Click"
