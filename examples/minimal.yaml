# Minimal configuration: one module, RGB light + button, polling (INT pin not wired).
# Wiring (ESP32 DevKit): VCC -> 3V3, GND -> GND, SDA -> GPIO21, SCL -> GPIO22.

substitutions:
  sda_pin: GPIO21
  scl_pin: GPIO22

esphome:
  name: rgb-button-minimal
  friendly_name: RGB Button Minimal

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://ShadyMCShadesen/esphome-dfrobot-rgb-button@main
    components: [dfrobot_rgb_button]

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  frequency: 100kHz

dfrobot_rgb_button:
  id: rgb_button
  address: 0x2A # DIP switch A2..A0 = 1 1 1

light:
  - platform: dfrobot_rgb_button
    name: "LED"

binary_sensor:
  - platform: dfrobot_rgb_button
    button:
      name: "Button"
